<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahmet Bilgiç | Ai Deneysel Çalışma Alanı</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-soft: #0f1b2d;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-2: rgba(255, 255, 255, 0.06);
      --text: #ecf3ff;
      --muted: #b7c5d9;
      --border: rgba(255, 255, 255, 0.14);
      --accent: #6ea8ff;
      --accent-2: #9f7aea;
      --success: #7ee787;
      --warning: #ffd166;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      --thumb-text: #ffffff;
    }

    body.light {
      --bg: #eef4fb;
      --bg-soft: #dfe9f7;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-2: rgba(255, 255, 255, 0.55);
      --text: #102033;
      --muted: #4d6178;
      --border: rgba(16, 32, 51, 0.12);
      --accent: #2563eb;
      --accent-2: #7c3aed;
      --success: #0f9d58;
      --warning: #d97706;
      --shadow: 0 14px 32px rgba(31, 60, 104, 0.14);
      --thumb-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(110,168,255,0.22), transparent 24%),
        radial-gradient(circle at top right, rgba(159,122,234,0.18), transparent 20%),
        linear-gradient(145deg, var(--bg), var(--bg-soft));
      transition: background 0.35s ease, color 0.35s ease;
    }

    body {
      padding: 28px 16px 60px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--panel), var(--panel-2));
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      border-radius: 30px;
      padding: 34px 26px;
      margin-bottom: 22px;
      animation: fadeUp 0.7s ease both;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(110,168,255,0.16), transparent 18%),
        radial-gradient(circle at 85% 25%, rgba(159,122,234,0.14), transparent 16%);
      pointer-events: none;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1.02;
      letter-spacing: -2px;
    }

    .gradient {
      background: linear-gradient(90deg, var(--accent), #8ec5ff, var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1.7fr 220px 170px;
      gap: 14px;
      margin: 18px 0 20px;
      animation: fadeUp 0.85s ease both;
    }

    .panel {
      background: linear-gradient(135deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-wrap {
      position: relative;
      padding: 10px;
    }

    .search-wrap input {
      width: 100%;
      border: 0;
      outline: none;
      border-radius: 16px;
      background: transparent;
      color: var(--text);
      padding: 16px 16px 16px 48px;
      font-size: 15px;
    }

    .search-wrap input::placeholder {
      color: var(--muted);
    }

    .search-icon {
      position: absolute;
      left: 26px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.9;
    }

    .stats {
      display: flex;
      gap: 10px;
      padding: 10px;
      align-items: stretch;
    }

    .stat {
      flex: 1 1 auto;
      min-width: 120px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 14px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-weight: 700;
      font-size: 18px;
    }

    .theme-btn {
      cursor: pointer;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--panel), var(--panel-2));
      color: var(--text);
      border-radius: 18px;
      padding: 0 18px;
      min-height: 74px;
      font-size: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .theme-btn:hover {
      transform: translateY(-2px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 18px;
      animation: fadeUp 1s ease both;
    }

    .sort-wrap {
      padding: 12px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .sort-wrap::after {
      content: "▾";
      position: absolute;
      right: 26px;
      pointer-events: none;
      color: var(--muted);
      font-size: 14px;
    }

    .sort-wrap select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 12px 42px 12px 14px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    .sort-wrap select option {
      background: #0f1b2d;
      color: #ecf3ff;
    }

    body.light .sort-wrap select option {
      background: #ffffff;
      color: #102033;
    }

    .status,
    .error {
      margin: 18px 0 20px;
      border-radius: 18px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--panel), var(--panel-2));
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .error {
      color: #ffd4d4;
      border-color: rgba(255, 90, 90, 0.24);
      background: rgba(180, 36, 36, 0.14);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 28px 4px 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .section-title .emoji {
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      border-radius: 26px;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
      animation: fadeUp 0.5s ease both;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(110,168,255,0.35);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.32);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 40%);
      pointer-events: none;
    }

    .thumb {
      position: relative;
      height: 150px;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      overflow: hidden;
      color: var(--thumb-text);
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.18), transparent 22%),
        linear-gradient(135deg, rgba(255,255,255,0.08), transparent 50%);
      pointer-events: none;
    }

    .thumb-left {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 72%;
    }

    .thumb-title {
      font-size: 22px;
      line-height: 1.08;
      word-break: break-word;
    }

    .thumb-icon {
      position: relative;
      z-index: 1;
      font-size: 40px;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    }

    .favorite-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      background: rgba(10, 18, 32, 0.28);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .favorite-btn:hover {
      transform: scale(1.06);
      background: rgba(10, 18, 32, 0.45);
    }

    .favorite-btn.active {
      color: var(--warning);
      border-color: rgba(255, 209, 102, 0.45);
      background: rgba(255, 209, 102, 0.12);
    }

    .card h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .filename {
      color: var(--muted);
      font-size: 13px;
      margin-top: -8px;
      word-break: break-word;
    }

    .open-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 4px;
    }

    .open-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(126, 231, 135, 0.10);
      color: var(--success);
      border: 1px solid rgba(126, 231, 135, 0.22);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .mini {
      font-size: 12px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      animation: fadeUp 1.1s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 950px) {
      .topbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .hero {
        padding: 24px 18px;
        border-radius: 24px;
      }

      .card {
        border-radius: 22px;
      }

      .thumb {
        height: 136px;
      }

      .thumb-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1><span class="gradient">Ahmet Bilgiç</span><br>Ai Deneysel Çalışma Alanı</h1>
    </section>

    <section class="topbar">
      <div class="panel search-wrap">
        <span class="search-icon">🔎</span>
        <input id="searchInput" type="text" placeholder="Sayfa ara..." />
      </div>

      <div class="panel stats">
        <div class="stat">
          <div class="stat-label">Toplam Sayfa</div>
          <div class="stat-value" id="pageCount">0</div>
        </div>
      </div>

      <button class="theme-btn" id="themeToggle">🌙 Tema Değiştir</button>
    </section>

    <section class="controls">
      <div class="panel sort-wrap">
        <select id="sortSelect">
          <option value="name-asc" selected>İsim A-Z</option>
          <option value="name-desc">İsim Z-A</option>
          <option value="favorites">Önce Favoriler</option>
        </select>
      </div>
    </section>

    <div id="status" class="status">Sayfalar yükleniyor...</div>
    <div id="error" class="error hidden"></div>

    <div id="favoritesSection" class="hidden">
      <div class="section-title"><span class="emoji">⭐</span> Favoriler</div>
      <section id="favoritesGrid" class="grid"></section>
    </div>

    <div id="allSection" class="hidden">
      <div class="section-title"><span class="emoji">🗂️</span> Tüm Sayfalar</div>
      <section id="grid" class="grid"></section>
    </div>

    <footer>
      GitHub Pages + GitHub API ile otomatik oluşturuldu.
    </footer>
  </div>

  <script>
    const user = "ahmedabilgic";
    const repo = "ahmetbilgic.github.io";

    const grid = document.getElementById("grid");
    const favoritesGrid = document.getElementById("favoritesGrid");
    const favoritesSection = document.getElementById("favoritesSection");
    const allSection = document.getElementById("allSection");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const pageCountEl = document.getElementById("pageCount");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const themeToggle = document.getElementById("themeToggle");

    let pages = [];

    const gradients = [
      "linear-gradient(135deg, #3b82f6, #7c3aed)",
      "linear-gradient(135deg, #0ea5e9, #14b8a6)",
      "linear-gradient(135deg, #f59e0b, #ef4444)",
      "linear-gradient(135deg, #8b5cf6, #ec4899)",
      "linear-gradient(135deg, #22c55e, #06b6d4)",
      "linear-gradient(135deg, #ec4899, #f97316)",
      "linear-gradient(135deg, #6366f1, #3b82f6)",
      "linear-gradient(135deg, #64748b, #334155)"
    ];

    const turkishMap = {
      "coklu": "Çoklu",
      "kolaj": "Kolaj",
      "olustur": "Oluştur",
      "olusturma": "Oluşturma",
      "nobet": "Nöbet",
      "ozeti": "Özeti",
      "ozet": "Özet",
      "gorev": "Görev",
      "takvim": "Takvim",
      "hakkimda": "Hakkımda",
      "iletisim": "İletişim",
      "anasayfa": "Anasayfa",
      "sayfa": "Sayfa",
      "arac": "Araç",
      "araci": "Aracı",
      "yardimci": "Yardımcı",
      "yapayzeka": "Yapay Zeka",
      "zeka": "Zeka",
      "deneysel": "Deneysel",
      "calisma": "Çalışma",
      "alani": "Alanı",
      "gorsel": "Görsel",
      "resim": "Resim",
      "fotograf": "Fotoğraf",
      "video": "Video",
      "muzik": "Müzik",
      "sarki": "Şarkı",
      "hikaye": "Hikaye",
      "siir": "Şiir",
      "oyun": "Oyun",
      "rapor": "Rapor",
      "veri": "Veri",
      "grafik": "Grafik",
      "analiz": "Analiz",
      "hesap": "Hesap",
      "hesapla": "Hesapla",
      "donusturucu": "Dönüştürücü",
      "cevirici": "Çevirici",
      "notlar": "Notlar",
      "not": "Not",
      "gunluk": "Günlük",
      "galeri": "Galeri",
      "sunum": "Sunum",
      "liste": "Liste",
      "takip": "Takip",
      "plan": "Plan",
      "proje": "Proje",
      "deneme": "Deneme",
      "test": "Test",
      "ozel": "Özel"
    };

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem("favorite-pages") || "[]");
      } catch {
        return [];
      }
    }

    function saveFavorites(list) {
      localStorage.setItem("favorite-pages", JSON.stringify(list));
    }

    function isFavorite(fileName) {
      return getFavorites().includes(fileName);
    }

    function toggleFavorite(fileName) {
      const favorites = getFavorites();
      const exists = favorites.includes(fileName);

      const next = exists
        ? favorites.filter(name => name !== fileName)
        : [...favorites, fileName];

      saveFavorites(next);
      render();
    }

    function smartTitleWord(word) {
      const lower = word.toLowerCase();
      if (turkishMap[lower]) return turkishMap[lower];
      return lower.charAt(0).toLocaleUpperCase("tr-TR") + lower.slice(1);
    }

    function prettifyName(name) {
      const clean = name
        .replace(/\.html$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      return clean
        .split(" ")
        .map(smartTitleWord)
        .join(" ");
    }

    function getIcon(fileName) {
      const n = fileName.toLowerCase();

      if (n.includes("kolaj")) return "🧩";
      if (n.includes("nobet")) return "🩺";
      if (n.includes("ozet") || n.includes("ozeti")) return "📝";
      if (n.includes("takvim") || n.includes("calendar")) return "📅";
      if (n.includes("cv") || n.includes("resume")) return "👤";
      if (n.includes("about") || n.includes("hakkimda") || n.includes("profile")) return "🙋";
      if (n.includes("project") || n.includes("proje") || n.includes("portfolio") || n.includes("work")) return "🚀";
      if (n.includes("calc") || n.includes("hesap") || n.includes("tool") || n.includes("converter")) return "🧮";
      if (n.includes("grafik") || n.includes("chart") || n.includes("dashboard") || n.includes("data")) return "📊";
      if (n.includes("contact") || n.includes("iletisim") || n.includes("mail")) return "📬";
      if (n.includes("gallery") || n.includes("galeri")) return "🖼️";
      if (n.includes("photo") || n.includes("fotograf") || n.includes("image") || n.includes("resim")) return "📷";
      if (n.includes("video")) return "🎬";
      if (n.includes("music") || n.includes("muzik") || n.includes("audio") || n.includes("sarki")) return "🎵";
      if (n.includes("blog") || n.includes("note") || n.includes("not") || n.includes("docs") || n.includes("article") || n.includes("yazi")) return "✍️";
      if (n.includes("story") || n.includes("hikaye")) return "📖";
      if (n.includes("siir")) return "📜";
      if (n.includes("test") || n.includes("demo") || n.includes("trial") || n.includes("sample") || n.includes("deneme")) return "🧪";
      if (n.includes("game") || n.includes("oyun")) return "🎮";
      if (n.includes("ai") || n.includes("zeka") || n.includes("yapay")) return "🤖";
      if (n.includes("rapor") || n.includes("report")) return "📋";
      if (n.includes("plan")) return "🗺️";
      if (n.includes("liste") || n.includes("list")) return "📚";
      if (n.includes("takip")) return "📌";
      if (n.includes("sunum") || n.includes("slide")) return "🎤";
      return "🌐";
    }

    function getGradientFromName(fileName) {
      let sum = 0;
      for (let i = 0; i < fileName.length; i++) sum += fileName.charCodeAt(i);
      return gradients[sum % gradients.length];
    }

    function sortPages(list) {
      const sorted = [...list];
      const mode = sortSelect.value;

      sorted.sort((a, b) => {
        if (mode === "name-asc") return a.pretty.localeCompare(b.pretty, "tr");
        if (mode === "name-desc") return b.pretty.localeCompare(a.pretty, "tr");
        if (mode === "favorites") {
          const favA = isFavorite(a.name) ? 1 : 0;
          const favB = isFavorite(b.name) ? 1 : 0;
          if (favA !== favB) return favB - favA;
          return a.pretty.localeCompare(b.pretty, "tr");
        }
        return a.pretty.localeCompare(b.pretty, "tr");
      });

      return sorted;
    }

    function getFilteredPages() {
      const q = searchInput.value.trim().toLowerCase();

      let result = [...pages];

      if (q) {
        result = result.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.pretty.toLowerCase().includes(q)
        );
      }

      return sortPages(result);
    }

    function createCard(page, index) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = page.name;
      a.style.animationDelay = `${index * 0.04}s`;

      const fav = isFavorite(page.name);

      a.innerHTML = `
        <button class="favorite-btn ${fav ? "active" : ""}" data-file="${page.name}" type="button" aria-label="Favori">
          ${fav ? "★" : "☆"}
        </button>

        <div class="thumb" style="background:${page.gradient}">
          <div class="thumb-left">
            <div class="thumb-title">${page.pretty}</div>
          </div>
          <div class="thumb-icon">${page.icon}</div>
        </div>

        <h2>${page.pretty}</h2>
        <div class="filename">${page.name}</div>

        <div class="open-row">
          <span class="open-badge">Sayfayı Aç →</span>
          <span class="mini">HTML sayfası</span>
        </div>
      `;

      const favBtn = a.querySelector(".favorite-btn");
      favBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(page.name);
      });

      return a;
    }

    function render() {
      const visible = getFilteredPages();
      const favoriteNames = getFavorites();

      const favoritePages = visible.filter(page => favoriteNames.includes(page.name));
      const normalPages = visible.filter(page => !favoriteNames.includes(page.name));

      grid.innerHTML = "";
      favoritesGrid.innerHTML = "";

      pageCountEl.textContent = visible.length;

      if (visible.length === 0) {
        statusEl.textContent = "Bu aramaya uygun sayfa bulunamadı.";
        statusEl.classList.remove("hidden");
        favoritesSection.classList.add("hidden");
        allSection.classList.add("hidden");
        return;
      }

      statusEl.classList.add("hidden");

      if (favoritePages.length > 0) {
        favoritesSection.classList.remove("hidden");
        favoritePages.forEach((page, i) => favoritesGrid.appendChild(createCard(page, i)));
      } else {
        favoritesSection.classList.add("hidden");
      }

      allSection.classList.remove("hidden");
      normalPages.forEach((page, i) => grid.appendChild(createCard(page, i)));
    }

    function setTheme(theme) {
      document.body.classList.toggle("light", theme === "light");
      localStorage.setItem("site-theme", theme);
      themeToggle.textContent = theme === "light" ? "🌙 Koyu Tema" : "☀️ Açık Tema";
    }

    function initTheme() {
      const saved = localStorage.getItem("site-theme");
      if (saved === "light" || saved === "dark") {
        setTheme(saved);
      } else {
        setTheme("dark");
      }
    }

    async function loadPages() {
      try {
        errorEl.classList.add("hidden");
        statusEl.classList.remove("hidden");
        statusEl.textContent = "Sayfalar yükleniyor...";

        const contentsUrl = `https://api.github.com/repos/${user}/${repo}/contents`;
        const res = await fetch(contentsUrl);

        if (!res.ok) {
          throw new Error("Repo içeriği alınamadı.");
        }

        const files = await res.json();

        const htmlFiles = files.filter(file =>
          file.type === "file" &&
          file.name.toLowerCase().endsWith(".html") &&
          file.name.toLowerCase() !== "index.html"
        );

        if (htmlFiles.length === 0) {
          statusEl.textContent = "Listelenecek HTML dosyası bulunamadı.";
          pageCountEl.textContent = "0";
          favoritesSection.classList.add("hidden");
          allSection.classList.add("hidden");
          return;
        }

        pages = htmlFiles.map((file) => {
          return {
            name: file.name,
            pretty: prettifyName(file.name),
            icon: getIcon(file.name),
            gradient: getGradientFromName(file.name)
          };
        });

        render();
      } catch (err) {
        statusEl.classList.add("hidden");
        favoritesSection.classList.add("hidden");
        allSection.classList.add("hidden");
        errorEl.classList.remove("hidden");
        errorEl.textContent = "Sayfalar yüklenemedi. Kullanıcı adı, repo adı veya GitHub API limiti kaynaklı geçici bir sorun olabilir.";
        console.error(err);
      }
    }

    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);
    themeToggle.addEventListener("click", () => {
      const next = document.body.classList.contains("light") ? "dark" : "light";
      setTheme(next);
    });

    initTheme();
    loadPages();
  </script>
</body>
</html>
