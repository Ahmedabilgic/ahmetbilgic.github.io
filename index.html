<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Araçları - iLovePDF Benzeri</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #e5322d;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .hero { text-align: center; margin: 20px 0 28px; }
    .hero h1 { margin: 0 0 8px; font-size: 34px; }
    .hero p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 12px; margin-bottom: 22px; }
    .tool-btn {
      border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px;
      text-align: left; font-weight: 700; cursor: pointer;
    }
    .tool-btn.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(229,50,45,.12); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin: 10px 0; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input, textarea, select, button {
      font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 10px 12px; width: 100%;
    }
    textarea { min-height: 72px; }
    button.action { background: var(--primary); color: #fff; border: none; font-weight: 700; cursor: pointer; }
    button.secondary { background: #fff; color: var(--text); cursor: pointer; }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    .actions button { width: auto; }
    .log { background: #111827; color: #e5e7eb; border-radius: 10px; padding: 10px; min-height: 80px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: pre-wrap; }
    .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>PDF Araçları</h1>
      <p>iLovePDF tarzında, tarayıcı içinde çalışan çok amaçlı PDF aracı (sunucuya yükleme yok).</p>
    </div>

    <div class="grid" id="toolTabs"></div>

    <div class="card">
      <div id="merge" class="panel active">
        <h2>PDF Birleştir</h2>
        <div class="field"><label>PDF dosyaları</label><input id="mergeFiles" type="file" accept="application/pdf" multiple /></div>
        <div class="actions"><button class="action" id="mergeRun">Birleştir ve İndir</button></div>
      </div>

      <div id="split" class="panel">
        <h2>PDF Böl</h2>
        <div class="row">
          <div class="field"><label>PDF dosyası</label><input id="splitFile" type="file" accept="application/pdf" /></div>
          <div class="field"><label>Aralık (örn: 1-3,5)</label><input id="splitRanges" type="text" placeholder="Boş bırakılırsa her sayfa ayrı dosya" /></div>
        </div>
        <div class="actions"><button class="action" id="splitRun">Böl ve İndir (.zip)</button></div>
      </div>

      <div id="rotate" class="panel">
        <h2>PDF Döndür</h2>
        <div class="row">
          <div class="field"><label>PDF dosyası</label><input id="rotateFile" type="file" accept="application/pdf" /></div>
          <div class="field"><label>Derece</label><select id="rotateDeg"><option>90</option><option>180</option><option>270</option></select></div>
        </div>
        <div class="field"><label>Sayfalar (örn: 1-2,4) - boşsa tümü</label><input id="rotatePages" type="text" /></div>
        <div class="actions"><button class="action" id="rotateRun">Döndür ve İndir</button></div>
      </div>

      <div id="extract" class="panel">
        <h2>Sayfa Ayıkla</h2>
        <div class="row">
          <div class="field"><label>PDF dosyası</label><input id="extractFile" type="file" accept="application/pdf" /></div>
          <div class="field"><label>Sayfalar (örn: 2,4-6)</label><input id="extractPages" type="text" /></div>
        </div>
        <div class="actions"><button class="action" id="extractRun">Yeni PDF Oluştur</button></div>
      </div>

      <div id="img2pdf" class="panel">
        <h2>JPG/PNG → PDF</h2>
        <div class="field"><label>Görseller</label><input id="imgFiles" type="file" accept="image/jpeg,image/png" multiple /></div>
        <div class="actions"><button class="action" id="img2pdfRun">PDF Oluştur</button></div>
      </div>

      <div id="pdf2img" class="panel">
        <h2>PDF → Görseller</h2>
        <div class="field"><label>PDF dosyası</label><input id="pdf2imgFile" type="file" accept="application/pdf" /></div>
        <div class="actions"><button class="action" id="pdf2imgRun">PNG Olarak İndir (.zip)</button></div>
      </div>

      <div class="note">Not: OCR, gerçek sıkıştırma ve Office dönüşümleri için sunucu tarafı işlem gerekir.</div>
      <div class="log" id="log">Hazır.</div>
    </div>
  </div>

  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    const { PDFDocument, degrees } = PDFLib;
    const logEl = document.getElementById('log');
    const tools = [
      ['merge', 'PDF Birleştir'], ['split', 'PDF Böl'], ['rotate', 'PDF Döndür'],
      ['extract', 'Sayfa Ayıkla'], ['img2pdf', 'JPG→PDF'], ['pdf2img', 'PDF→PNG']
    ];

    function log(msg) { logEl.textContent += `\n${msg}`; logEl.scrollTop = logEl.scrollHeight; }
    function resetLog(title) { logEl.textContent = title; }

    function setupTabs() {
      const wrap = document.getElementById('toolTabs');
      tools.forEach(([id, name], i) => {
        const b = document.createElement('button');
        b.className = `tool-btn ${i === 0 ? 'active' : ''}`;
        b.textContent = name;
        b.onclick = () => {
          document.querySelectorAll('.tool-btn').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          document.getElementById(id).classList.add('active');
          resetLog(`${name} aracı hazır.`);
        };
        wrap.appendChild(b);
      });
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function parsePages(text, maxPages) {
      if (!text || !text.trim()) return Array.from({ length: maxPages }, (_, i) => i + 1);
      const set = new Set();
      text.split(',').forEach(part => {
        const p = part.trim();
        if (!p) return;
        if (p.includes('-')) {
          const [a, b] = p.split('-').map(Number);
          if (Number.isFinite(a) && Number.isFinite(b)) {
            const start = Math.min(a, b), end = Math.max(a, b);
            for (let i = start; i <= end; i++) if (i >= 1 && i <= maxPages) set.add(i);
          }
        } else {
          const n = Number(p);
          if (Number.isFinite(n) && n >= 1 && n <= maxPages) set.add(n);
        }
      });
      return [...set].sort((a, b) => a - b);
    }

    document.getElementById('mergeRun').onclick = async () => {
      try {
        resetLog('Birleştirme başladı...');
        const files = [...document.getElementById('mergeFiles').files];
        if (!files.length) throw new Error('Lütfen en az 1 PDF seçin.');
        const out = await PDFDocument.create();
        for (const f of files) {
          const src = await PDFDocument.load(await f.arrayBuffer());
          const pages = await out.copyPages(src, src.getPageIndices());
          pages.forEach(p => out.addPage(p));
          log(`+ ${f.name} (${src.getPageCount()} sayfa)`);
        }
        downloadBlob(new Blob([await out.save()], { type: 'application/pdf' }), 'merged.pdf');
        log('Tamamlandı.');
      } catch (e) { log(`Hata: ${e.message}`); }
    };

    document.getElementById('splitRun').onclick = async () => {
      try {
        resetLog('Bölme başladı...');
        const file = document.getElementById('splitFile').files[0];
        if (!file) throw new Error('PDF seçin.');
        const src = await PDFDocument.load(await file.arrayBuffer());
        const pages = parsePages(document.getElementById('splitRanges').value, src.getPageCount());
        const zip = new JSZip();
        for (const p of pages) {
          const doc = await PDFDocument.create();
          const [copied] = await doc.copyPages(src, [p - 1]);
          doc.addPage(copied);
          zip.file(`page-${p}.pdf`, await doc.save());
          log(`Sayfa ${p} eklendi.`);
        }
        downloadBlob(await zip.generateAsync({ type: 'blob' }), 'split-pages.zip');
        log('Tamamlandı.');
      } catch (e) { log(`Hata: ${e.message}`); }
    };

    document.getElementById('rotateRun').onclick = async () => {
      try {
        resetLog('Döndürme başladı...');
        const file = document.getElementById('rotateFile').files[0];
        if (!file) throw new Error('PDF seçin.');
        const src = await PDFDocument.load(await file.arrayBuffer());
        const deg = Number(document.getElementById('rotateDeg').value);
        const targets = parsePages(document.getElementById('rotatePages').value, src.getPageCount());
        targets.forEach(p => src.getPage(p - 1).setRotation(degrees(deg)));
        downloadBlob(new Blob([await src.save()], { type: 'application/pdf' }), 'rotated.pdf');
        log(`Sayfalar döndürüldü: ${targets.join(', ')}`);
      } catch (e) { log(`Hata: ${e.message}`); }
    };

    document.getElementById('extractRun').onclick = async () => {
      try {
        resetLog('Ayıklama başladı...');
        const file = document.getElementById('extractFile').files[0];
        if (!file) throw new Error('PDF seçin.');
        const src = await PDFDocument.load(await file.arrayBuffer());
        const targets = parsePages(document.getElementById('extractPages').value, src.getPageCount());
        if (!targets.length) throw new Error('Geçerli sayfa girin.');
        const out = await PDFDocument.create();
        const copied = await out.copyPages(src, targets.map(n => n - 1));
        copied.forEach(p => out.addPage(p));
        downloadBlob(new Blob([await out.save()], { type: 'application/pdf' }), 'extracted.pdf');
        log(`Ayıklanan sayfalar: ${targets.join(', ')}`);
      } catch (e) { log(`Hata: ${e.message}`); }
    };

    document.getElementById('img2pdfRun').onclick = async () => {
      try {
        resetLog('PDF oluşturuluyor...');
        const files = [...document.getElementById('imgFiles').files];
        if (!files.length) throw new Error('En az 1 görsel seçin.');
        const doc = await PDFDocument.create();
        for (const f of files) {
          const bytes = await f.arrayBuffer();
          const isPng = f.type.includes('png');
          const img = isPng ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
          const page = doc.addPage([img.width, img.height]);
          page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
          log(`+ ${f.name}`);
        }
        downloadBlob(new Blob([await doc.save()], { type: 'application/pdf' }), 'images.pdf');
        log('Tamamlandı.');
      } catch (e) { log(`Hata: ${e.message}`); }
    };

    document.getElementById('pdf2imgRun').onclick = async () => {
      try {
        resetLog('PDF sayfaları görsele çevriliyor...');
        const file = document.getElementById('pdf2imgFile').files[0];
        if (!file) throw new Error('PDF seçin.');
        const data = new Uint8Array(await file.arrayBuffer());
        const loadingTask = pdfjsLib.getDocument({ data });
        const pdf = await loadingTask.promise;
        const zip = new JSZip();
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 2 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
          zip.file(`page-${i}.png`, blob);
          log(`Sayfa ${i}/${pdf.numPages}`);
        }
        downloadBlob(await zip.generateAsync({ type: 'blob' }), 'pdf-images.zip');
        log('Tamamlandı.');
      } catch (e) { log(`Hata: ${e.message}`); }
    };

    setupTabs();
  </script>
</body>
</html>
