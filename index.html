<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmet Bilgiç | Ai Deneysel Çalışma Alanı</title>

<style>
:root{
  --bg:#09090b;
  --bg-2:#111113;
  --card:rgba(255,255,255,.055);
  --card-2:rgba(255,255,255,.035);
  --border:rgba(255,255,255,.08);
  --text:#f5f5f7;
  --muted:#a1a1aa;
  --accent:#7dd3fc;
  --accent-2:#60a5fa;
  --favorite:#f5c451;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top, rgba(255,255,255,.07), transparent 28%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  letter-spacing:-.02em;
}

body{
  padding:20px 14px 40px;
}

.container{
  max-width:1120px;
  margin:0 auto;
}

.hero{
  text-align:center;
  padding:34px 10px 24px;
}

.hero h1{
  margin:0;
  font-size:clamp(34px,6vw,64px);
  line-height:1.02;
  letter-spacing:-.055em;
  font-weight:700;
}

.hero .name{
  display:block;
}

.hero .sub{
  display:block;
}

.hero p{
  margin:12px auto 0;
  max-width:560px;
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
}

.topbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) 150px 120px;
  gap:10px;
  margin-bottom:14px;
}

.panel{
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.search-wrap{
  position:relative;
  padding:8px;
}

.search-wrap input{
  width:100%;
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  padding:14px 14px 14px 42px;
  font-size:14px;
  border-radius:14px;
}

.search-wrap input::placeholder{
  color:var(--muted);
}

.search-icon{
  position:absolute;
  left:21px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:14px;
}

.stats{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
}

.stat{
  width:100%;
  text-align:center;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 12px;
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:2px;
}

.stat-value{
  font-size:18px;
  font-weight:650;
  letter-spacing:-.04em;
}

.theme-btn{
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--card),var(--card-2));
  color:var(--text);
  border-radius:16px;
  min-height:60px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .18s ease,opacity .18s ease,border-color .18s ease;
}

.theme-btn:hover{
  transform:translateY(-1px);
}

.controls{
  margin-bottom:18px;
}

.sort-wrap{
  position:relative;
  padding:8px;
}

.sort-wrap::after{
  content:"▾";
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  color:var(--muted);
  font-size:12px;
}

.sort-wrap select{
  width:100%;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:14px;
  padding:12px 34px 12px 12px;
  font-size:13px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
}

.sort-wrap select option{
  background:#111113;
  color:#f5f5f7;
}

.status,.error{
  margin:14px 0 18px;
  padding:14px 16px;
  text-align:center;
  border-radius:16px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--card),var(--card-2));
  color:var(--muted);
  box-shadow:var(--shadow);
  font-size:14px;
}

.error{
  color:#fecaca;
  background:rgba(127,29,29,.16);
  border-color:rgba(248,113,113,.18);
}

.section-title{
  margin:22px 2px 12px;
  font-size:14px;
  font-weight:700;
  letter-spacing:-.03em;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
  text-decoration:none;
  color:inherit;
  border-radius:22px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--card),var(--card-2));
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.16);
  box-shadow:0 18px 40px rgba(0,0,0,.26);
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 40%);
  pointer-events:none;
}

.thumb{
  position:relative;
  min-height:96px;
  border-radius:18px;
  padding:14px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  overflow:hidden;
  color:#fff;
}

.thumb::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%);
  pointer-events:none;
}

.thumb-left,.thumb-icon{
  position:relative;
  z-index:1;
}

.thumb-left{
  max-width:76%;
}

.thumb-title{
  font-size:17px;
  line-height:1.08;
  font-weight:700;
  letter-spacing:-.04em;
  word-break:break-word;
}

.thumb-icon{
  font-size:32px;
  opacity:.98;
}

.favorite-btn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:3;
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  background:rgba(0,0,0,.16);
  color:#fff;
  font-size:14px;
  cursor:pointer;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease;
}

.favorite-btn:hover{
  transform:scale(1.04);
  background:rgba(0,0,0,.24);
}

.favorite-btn.active{
  color:var(--favorite);
  border-color:rgba(245,196,81,.35);
  background:rgba(245,196,81,.1);
}

.card h2{
  margin:2px 2px 0;
  font-size:16px;
  line-height:1.2;
  font-weight:650;
  letter-spacing:-.04em;
  word-break:break-word;
}

.filename{
  margin:0 2px;
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
  word-break:break-word;
}

.open-row{
  margin-top:auto;
  padding:2px 2px 0;
}

.open-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:42px;
  padding:8px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--text);
  font-size:12px;
  font-weight:600;
}

.hidden{
  display:none !important;
}

footer{
  margin-top:22px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

body.light{
  --bg:#f5f5f7;
  --bg-2:#ececf1;
  --card:rgba(255,255,255,.78);
  --card-2:rgba(255,255,255,.62);
  --border:rgba(17,17,17,.08);
  --text:#111111;
  --muted:#6b7280;
  --shadow:0 18px 40px rgba(17,24,39,.08);
}

body.light .sort-wrap select option{
  background:#fff;
  color:#111;
}

body.light .card:hover{
  border-color:rgba(17,17,17,.12);
  box-shadow:0 16px 30px rgba(17,24,39,.08);
}

@media (max-width:860px){
  .topbar{
    grid-template-columns:1fr;
  }
}

@media (max-width:640px){
  body{
    padding:14px 10px 30px;
  }

  .hero{
    padding:26px 4px 18px;
  }

  .hero h1{
    font-size:clamp(30px,10vw,42px);
  }

  .hero p{
    font-size:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .thumb{
    min-height:90px;
  }

  .thumb-title{
    font-size:16px;
  }
}
</style>
</head>
<body>

<div class="container">

  <section class="hero">
    <h1>
      <span class="name">Ahmet Bilgiç</span>
      <span class="sub">Ai Deneysel Çalışma Alanı</span>
    </h1>
    <p>Sade, hızlı ve deneysel sayfa merkezi.</p>
  </section>

  <section class="topbar">
    <div class="panel search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="text" placeholder="Sayfa ara">
    </div>

    <div class="panel stats">
      <div class="stat">
        <div class="stat-label">Toplam</div>
        <div class="stat-value" id="pageCount">0</div>
      </div>
    </div>

    <button class="theme-btn" id="themeToggle">◐ Tema</button>
  </section>

  <section class="controls">
    <div class="panel sort-wrap">
      <select id="sortSelect">
        <option value="name-asc" selected>İsim A-Z</option>
        <option value="name-desc">İsim Z-A</option>
        <option value="favorites">Önce Favoriler</option>
      </select>
    </div>
  </section>

  <div id="status" class="status">Sayfalar yükleniyor...</div>
  <div id="error" class="error hidden"></div>

  <div id="favoritesSection" class="hidden">
    <div class="section-title">Favoriler</div>
    <section id="favoritesGrid" class="grid"></section>
  </div>

  <div id="allSection" class="hidden">
    <div class="section-title">Tüm Sayfalar</div>
    <section id="grid" class="grid"></section>
  </div>

  <footer>GitHub Pages ile otomatik listelenir.</footer>

</div>

<script>
const user = "ahmedabilgic";
const repo = "ahmetbilgic.github.io";

const grid = document.getElementById("grid");
const favoritesGrid = document.getElementById("favoritesGrid");
const favoritesSection = document.getElementById("favoritesSection");
const allSection = document.getElementById("allSection");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const pageCountEl = document.getElementById("pageCount");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
const themeToggle = document.getElementById("themeToggle");

let pages = [];

const gradients = [
  "linear-gradient(135deg, #60a5fa, #6366f1)",
  "linear-gradient(135deg, #34d399, #06b6d4)",
  "linear-gradient(135deg, #f59e0b, #ef4444)",
  "linear-gradient(135deg, #8b5cf6, #ec4899)",
  "linear-gradient(135deg, #22c55e, #14b8a6)",
  "linear-gradient(135deg, #fb7185, #f97316)",
  "linear-gradient(135deg, #818cf8, #3b82f6)",
  "linear-gradient(135deg, #64748b, #334155)"
];

const turkishMap = {
  "coklu":"Çoklu",
  "kolaj":"Kolaj",
  "olustur":"Oluştur",
  "olusturma":"Oluşturma",
  "nobet":"Nöbet",
  "ozeti":"Özeti",
  "ozet":"Özet",
  "gorev":"Görev",
  "takvim":"Takvim",
  "hakkimda":"Hakkımda",
  "iletisim":"İletişim",
  "anasayfa":"Anasayfa",
  "sayfa":"Sayfa",
  "arac":"Araç",
  "araci":"Aracı",
  "yardimci":"Yardımcı",
  "yapayzeka":"Yapay Zeka",
  "zeka":"Zeka",
  "deneysel":"Deneysel",
  "calisma":"Çalışma",
  "alani":"Alanı",
  "gorsel":"Görsel",
  "resim":"Resim",
  "fotograf":"Fotoğraf",
  "video":"Video",
  "muzik":"Müzik",
  "sarki":"Şarkı",
  "hikaye":"Hikaye",
  "siir":"Şiir",
  "oyun":"Oyun",
  "rapor":"Rapor",
  "veri":"Veri",
  "grafik":"Grafik",
  "analiz":"Analiz",
  "hesap":"Hesap",
  "hesapla":"Hesapla",
  "donusturucu":"Dönüştürücü",
  "cevirici":"Çevirici",
  "notlar":"Notlar",
  "not":"Not",
  "gunluk":"Günlük",
  "galeri":"Galeri",
  "sunum":"Sunum",
  "liste":"Liste",
  "takip":"Takip",
  "plan":"Plan",
  "proje":"Proje",
  "deneme":"Deneme",
  "test":"Test",
  "ozel":"Özel"
};

function getFavorites(){
  try{
    return JSON.parse(localStorage.getItem("favorite-pages") || "[]");
  }catch{
    return [];
  }
}

function saveFavorites(list){
  localStorage.setItem("favorite-pages", JSON.stringify(list));
}

function isFavorite(fileName){
  return getFavorites().includes(fileName);
}

function toggleFavorite(fileName){
  const favorites = getFavorites();
  const exists = favorites.includes(fileName);
  const next = exists
    ? favorites.filter(name => name !== fileName)
    : [...favorites, fileName];

  saveFavorites(next);
  render();
}

function smartTitleWord(word){
  const lower = word.toLowerCase();
  if(turkishMap[lower]) return turkishMap[lower];
  return lower.charAt(0).toLocaleUpperCase("tr-TR") + lower.slice(1);
}

function prettifyName(name){
  const clean = name
    .replace(/\.html$/i, "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  return clean.split(" ").map(smartTitleWord).join(" ");
}

function getIcon(fileName){
  const n = fileName.toLowerCase();

  if(n.includes("kolaj")) return "🧩";
  if(n.includes("nobet")) return "🩺";
  if(n.includes("ozet") || n.includes("ozeti")) return "📝";
  if(n.includes("takvim") || n.includes("calendar")) return "📅";
  if(n.includes("cv") || n.includes("resume")) return "👤";
  if(n.includes("about") || n.includes("hakkimda") || n.includes("profile")) return "🙋";
  if(n.includes("project") || n.includes("proje") || n.includes("portfolio") || n.includes("work")) return "🚀";
  if(n.includes("calc") || n.includes("hesap") || n.includes("tool") || n.includes("converter")) return "🧮";
  if(n.includes("grafik") || n.includes("chart") || n.includes("dashboard") || n.includes("data")) return "📊";
  if(n.includes("contact") || n.includes("iletisim") || n.includes("mail")) return "📬";
  if(n.includes("gallery") || n.includes("galeri")) return "🖼️";
  if(n.includes("photo") || n.includes("fotograf") || n.includes("image") || n.includes("resim")) return "📷";
  if(n.includes("video")) return "🎬";
  if(n.includes("music") || n.includes("muzik") || n.includes("audio") || n.includes("sarki")) return "🎵";
  if(n.includes("blog") || n.includes("note") || n.includes("not") || n.includes("docs") || n.includes("article") || n.includes("yazi")) return "✍️";
  if(n.includes("story") || n.includes("hikaye")) return "📖";
  if(n.includes("siir")) return "📜";
  if(n.includes("test") || n.includes("demo") || n.includes("trial") || n.includes("sample") || n.includes("deneme")) return "🧪";
  if(n.includes("game") || n.includes("oyun")) return "🎮";
  if(n.includes("ai") || n.includes("zeka") || n.includes("yapay")) return "🤖";
  if(n.includes("rapor") || n.includes("report")) return "📋";
  if(n.includes("plan")) return "🗺️";
  if(n.includes("liste") || n.includes("list")) return "📚";
  if(n.includes("takip")) return "📌";
  if(n.includes("sunum") || n.includes("slide")) return "🎤";

  return "◌";
}

function getGradientFromName(fileName){
  let sum = 0;
  for(let i = 0; i < fileName.length; i++) sum += fileName.charCodeAt(i);
  return gradients[sum % gradients.length];
}

function sortPages(list){
  const sorted = [...list];
  const mode = sortSelect.value;

  sorted.sort((a, b) => {
    if(mode === "name-asc") return a.pretty.localeCompare(b.pretty, "tr");
    if(mode === "name-desc") return b.pretty.localeCompare(a.pretty, "tr");

    if(mode === "favorites"){
      const favA = isFavorite(a.name) ? 1 : 0;
      const favB = isFavorite(b.name) ? 1 : 0;
      if(favA !== favB) return favB - favA;
      return a.pretty.localeCompare(b.pretty, "tr");
    }

    return a.pretty.localeCompare(b.pretty, "tr");
  });

  return sorted;
}

function getFilteredPages(){
  const q = searchInput.value.trim().toLowerCase();
  let result = [...pages];

  if(q){
    result = result.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.pretty.toLowerCase().includes(q)
    );
  }

  return sortPages(result);
}

function createCard(page){
  const a = document.createElement("a");
  a.className = "card";
  a.href = page.name;

  const fav = isFavorite(page.name);

  a.innerHTML = `
    <button class="favorite-btn ${fav ? "active" : ""}" type="button" aria-label="Favori">
      ${fav ? "★" : "☆"}
    </button>

    <div class="thumb" style="background:${page.gradient}">
      <div class="thumb-left">
        <div class="thumb-title">${page.pretty}</div>
      </div>
      <div class="thumb-icon">${page.icon}</div>
    </div>

    <h2>${page.pretty}</h2>
    <div class="filename">${page.name}</div>

    <div class="open-row">
      <span class="open-badge">Aç</span>
    </div>
  `;

  const favBtn = a.querySelector(".favorite-btn");
  favBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggleFavorite(page.name);
  });

  return a;
}

function render(){
  const visible = getFilteredPages();
  const favoriteNames = getFavorites();

  const favoritePages = visible.filter(page => favoriteNames.includes(page.name));
  const normalPages = visible.filter(page => !favoriteNames.includes(page.name));

  grid.innerHTML = "";
  favoritesGrid.innerHTML = "";
  pageCountEl.textContent = visible.length;

  if(visible.length === 0){
    statusEl.textContent = "Bu aramaya uygun sayfa bulunamadı.";
    statusEl.classList.remove("hidden");
    favoritesSection.classList.add("hidden");
    allSection.classList.add("hidden");
    return;
  }

  statusEl.classList.add("hidden");

  if(favoritePages.length > 0){
    favoritesSection.classList.remove("hidden");
    favoritePages.forEach(page => favoritesGrid.appendChild(createCard(page)));
  }else{
    favoritesSection.classList.add("hidden");
  }

  allSection.classList.remove("hidden");
  normalPages.forEach(page => grid.appendChild(createCard(page)));
}

function setTheme(theme){
  document.body.classList.toggle("light", theme === "light");
  localStorage.setItem("site-theme", theme);
  themeToggle.textContent = theme === "light" ? "◐ Tema" : "◑ Tema";
}

function initTheme(){
  const saved = localStorage.getItem("site-theme");
  if(saved === "light" || saved === "dark"){
    setTheme(saved);
  }else{
    setTheme("dark");
  }
}

async function loadPages(){
  try{
    errorEl.classList.add("hidden");
    statusEl.classList.remove("hidden");
    statusEl.textContent = "Sayfalar yükleniyor...";

    const contentsUrl = `https://api.github.com/repos/${user}/${repo}/contents`;
    const res = await fetch(contentsUrl);

    if(!res.ok) throw new Error("Repo içeriği alınamadı.");

    const files = await res.json();

    const htmlFiles = files.filter(file =>
      file.type === "file" &&
      file.name.toLowerCase().endsWith(".html") &&
      file.name.toLowerCase() !== "index.html"
    );

    if(htmlFiles.length === 0){
      statusEl.textContent = "Listelenecek HTML dosyası bulunamadı.";
      pageCountEl.textContent = "0";
      favoritesSection.classList.add("hidden");
      allSection.classList.add("hidden");
      return;
    }

    pages = htmlFiles.map(file => ({
      name: file.name,
      pretty: prettifyName(file.name),
      icon: getIcon(file.name),
      gradient: getGradientFromName(file.name)
    }));

    render();
  }catch(err){
    statusEl.classList.add("hidden");
    favoritesSection.classList.add("hidden");
    allSection.classList.add("hidden");
    errorEl.classList.remove("hidden");
    errorEl.textContent = "Sayfalar yüklenemedi. Kullanıcı adı, repo adı veya GitHub API limiti kaynaklı geçici bir sorun olabilir.";
    console.error(err);
  }
}

searchInput.addEventListener("input", render);
sortSelect.addEventListener("change", render);
themeToggle.addEventListener("click", () => {
  const next = document.body.classList.contains("light") ? "dark" : "light";
  setTheme(next);
});

initTheme();
loadPages();
</script>

</body>
</html>
