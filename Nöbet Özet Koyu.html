<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nöbet Özeti</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --border: #d7dee8;
      --border-strong: #c1ccd9;
      --text: #1f3042;
      --muted: #617285;
      --accent: #2f5378;
      --accent-dark: #244463;
      --accent-soft: #eef3f8;
      --ok-bg: #edf7f0;
      --ok-text: #245d37;
      --ok-border: #c7dece;
      --warn-bg: #fff7eb;
      --warn-text: #8b5a16;
      --warn-border: #ead2a9;
      --error-bg: #fff2f2;
      --error-text: #973535;
      --error-border: #e7c1c1;
      --shadow: 0 10px 24px rgba(27, 45, 66, 0.06);
      --radius: 14px;
      --radius-sm: 10px;
      --hero-grad-start: #35597f;
      --hero-grad-end: #2f5378;
      --toolbar-bg: #f6f8fb;
      --thead-bg: #eef3f8;
      --thead-text: #25476d;
      --row-hover: #f8fbff;
      --input-bg: #ffffff;
      --textarea-bg: #fbfdff;
      --mono-bg: #fbfdff;
      --copy-btn-bg: #f4f7fb;
      --copy-btn-hover: #e8eef7;
      --button-bg: #ffffff;
      --button-ghost-bg: #f9fbfe;
      --button-hover-border: #aebccc;
      --textarea-text: #22384f;
      --pill-border: #d6e4ff;
      --focus-border: #8fb3ea;
      --hero-border: rgba(255,255,255,0.18);
      --hero-subtext: rgba(255,255,255,0.9);
      --focus-ring: rgba(45, 99, 173, 0.12);
      --table-line: #e7eef7;
    }

    body.dark-theme {
      --bg: #0b1220;
      --surface: #121b2b;
      --surface-strong: #0f1725;
      --border: #263247;
      --border-strong: #33425c;
      --text: #e6eef8;
      --muted: #9eb0c7;
      --accent: #7bb0ff;
      --accent-dark: #5f95e6;
      --accent-soft: #18263c;
      --ok-bg: #12261b;
      --ok-text: #a8e0b5;
      --ok-border: #244934;
      --warn-bg: #2c2313;
      --warn-text: #ffd28a;
      --warn-border: #5d4721;
      --error-bg: #2c171a;
      --error-text: #ffb4b8;
      --error-border: #623039;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      --hero-grad-start: #111a2d;
      --hero-grad-end: #0b1322;
      --toolbar-bg: #0f1725;
      --thead-bg: #162236;
      --thead-text: #c6daf5;
      --row-hover: #162235;
      --input-bg: #0f1725;
      --textarea-bg: #0d1522;
      --mono-bg: #0d1522;
      --copy-btn-bg: #162033;
      --copy-btn-hover: #1d2b44;
      --button-bg: #162033;
      --button-ghost-bg: #132031;
      --button-hover-border: #4e6384;
      --textarea-text: #dce8f8;
      --pill-border: #2d4466;
      --focus-border: #7bb0ff;
      --hero-border: rgba(148, 163, 184, 0.16);
      --hero-subtext: rgba(230, 238, 248, 0.82);
      --focus-ring: rgba(123, 176, 255, 0.18);
      --table-line: #24344b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--text);
      line-height: 1.45;
      background: var(--bg);
    }

    .wrap {
      max-width: 1120px;
      margin: 24px auto 36px;
      padding: 0 18px;
    }

    .hero {
      background: linear-gradient(180deg, var(--hero-grad-start) 0%, var(--hero-grad-end) 100%);
      color: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 6px 16px rgba(27, 45, 66, 0.08);
      margin-bottom: 14px;
      border: 1px solid var(--hero-border);
    }

    .hero h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--hero-subtext);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .mini-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      border: 1px solid var(--pill-border);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      margin: 2px 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    input[type="file"] {
      width: 100%;
      display: block;
      border: 1px dashed var(--border-strong);
      background: var(--input-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 300px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font: 14px/1.55 Consolas, "Courier New", monospace;
      resize: vertical;
      background: var(--textarea-bg);
      color: var(--textarea-text);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    input[type="file"]:focus,
    textarea:focus {
      border-color: var(--focus-border);
      box-shadow: 0 0 0 4px var(--focus-ring);
      background: var(--input-bg);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--toolbar-bg);
      border-radius: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--button-bg);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
      box-shadow: 0 2px 6px rgba(27, 45, 66, 0.04);
      min-height: 42px;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--button-hover-border);
      box-shadow: 0 4px 10px rgba(27, 45, 66, 0.08);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-dark);
      box-shadow: 0 3px 8px rgba(27, 45, 66, 0.10);
    }

    button.secondary {
      background: var(--button-bg);
    }

    button.ghost {
      background: var(--button-ghost-bg);
    }

    .status {
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
      font-size: 14px;
      font-weight: 600;
    }

    .status.ok { display: block; background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
    .status.warn { display: block; background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
    .status.error { display: block; background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }

    .output-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-strong);
      overflow: auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .table-wrap {
      border-radius: 10px;
      overflow: hidden;
    }

    .sr-only-area {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--table-line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      line-height: 1.32;
    }

    td:nth-child(3) {
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--thead-bg);
      color: var(--thead-text);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
      z-index: 1;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .mono {
      font-family: "Segoe UI", Calibri, Arial, sans-serif;
      white-space: pre-wrap;
      background: var(--mono-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 60px;
    }

    .small { font-size: 13px; }

    .subtle-title {
      margin: 18px 0 10px;
      font-size: 15px;
      font-weight: 760;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .wrap { margin-top: 18px; }
      .hero { padding: 24px 20px; border-radius: 22px; }
      .hero h1 { font-size: 26px; }
      .card { padding: 18px; border-radius: 18px; }
      .row { flex-direction: column; align-items: stretch; }
      button { width: 100%; }
      th, td { padding: 11px 10px; }
    }
  
    .output-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
    }

    .copy-btn-top {
      font-size:13px;
      padding:6px 12px;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--copy-btn-bg);
      cursor:pointer;
    }

    .copy-btn-top:hover{
      background:var(--copy-btn-hover);
    }

    .hero-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .theme-toggle-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
    }

    .theme-toggle {
      position: relative;
      width: 74px;
      height: 40px;
      border: none;
      border-radius: 999px;
      padding: 0;
      min-height: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.08));
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.18), inset 0 -1px 1px rgba(0,0,0,0.1), 0 8px 20px rgba(0,0,0,0.18);
      overflow: hidden;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover {
      transform: none;
      border-color: transparent;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.18), inset 0 -1px 1px rgba(0,0,0,0.1), 0 10px 24px rgba(0,0,0,0.22);
    }

    .theme-toggle-track {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, #8fd3ff 0%, #3f8cff 100%);
      transition: background .45s ease;
    }

    .theme-toggle-track::before,
    .theme-toggle-track::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transition: opacity .35s ease, transform .45s ease;
    }

    .theme-toggle-track::before {
      width: 20px;
      height: 20px;
      top: 7px;
      left: 10px;
      background: rgba(255,255,255,0.38);
      box-shadow: 18px 4px 0 -6px rgba(255,255,255,0.24), 34px -2px 0 -10px rgba(255,255,255,0.18);
    }

    .theme-toggle-track::after {
      width: 4px;
      height: 4px;
      top: 11px;
      right: 16px;
      background: rgba(255,255,255,0.95);
      box-shadow: -10px 8px 0 0 rgba(255,255,255,0.8), 6px 14px 0 0 rgba(255,255,255,0.65), -2px -2px 0 0 rgba(255,255,255,0.85);
      opacity: 0;
      transform: scale(0.6);
    }

    .theme-toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff6b2 0%, #ffd24d 100%);
      box-shadow: 0 6px 14px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .45s cubic-bezier(.22,1,.36,1), background .45s ease, box-shadow .45s ease;
      will-change: transform;
    }

    .theme-toggle-icon {
      position: absolute;
      width: 17px;
      height: 17px;
      color: #fff;
      transition: opacity .28s ease, transform .45s cubic-bezier(.22,1,.36,1);
    }

    .theme-toggle-icon svg { width: 100%; height: 100%; display: block; }

    .theme-toggle-icon.sun {
      color: #8b5a16;
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .theme-toggle-icon.moon {
      color: #dbeafe;
      opacity: 0;
      transform: rotate(-40deg) scale(0.6);
    }

    body.dark-theme .theme-toggle-track {
      background: linear-gradient(180deg, #18243a 0%, #0a1120 100%);
    }

    body.dark-theme .theme-toggle-track::before {
      opacity: 0;
      transform: translateY(4px) scale(0.8);
    }

    body.dark-theme .theme-toggle-track::after {
      opacity: 1;
      transform: scale(1);
    }

    body.dark-theme .theme-toggle-thumb {
      transform: translateX(34px);
      background: linear-gradient(180deg, #dfe7f7 0%, #aab7d4 100%);
      box-shadow: 0 6px 16px rgba(0,0,0,0.34);
    }

    body.dark-theme .theme-toggle-icon.sun {
      opacity: 0;
      transform: rotate(60deg) scale(0.55);
    }

    body.dark-theme .theme-toggle-icon.moon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }


</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-bar">
        <div>
          <h1>Nöbet Özeti</h1>
          <p></p>
        </div>
        <div class="theme-toggle-wrap">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Temayı değiştir" aria-pressed="false" title="Açık/Koyu tema">
            <span class="theme-toggle-track"></span>
            <span class="theme-toggle-thumb">
              <span class="theme-toggle-icon sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
                  <path d="M12 2.5V5.2M12 18.8V21.5M21.5 12H18.8M5.2 12H2.5M18.72 5.28L16.81 7.19M7.19 16.81L5.28 18.72M18.72 18.72L16.81 16.81M7.19 7.19L5.28 5.28" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="theme-toggle-icon moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.2 14.15A8.5 8.5 0 1 1 9.85 3.8a7.1 7.1 0 0 0 10.35 10.35Z" fill="currentColor"/>
                </svg>
              </span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-head">
        <h2>Veri Girişi</h2>
        <div class="mini-note">Tarih | Gün | MESAİ | A | B | C</div>
      </div>

      

      <label class="field-label" for="excelFile">Dosya seç</label>
      <input id="excelFile" type="file" accept=".csv,.xlsx,.xls" />

      <label class="field-label" for="input">Tablo içeriği</label>
      <textarea id="input" spellcheck="false" placeholder="Nöbet listesini buraya kopyalayın veya CSV dosyası yükleyin."></textarea>

      <div class="row">
        <div class="toolbar">
          <button class="primary" id="generateBtn">Özet Oluştur</button>
          <button class="secondary" id="copyTableBtn">Tabloyu Kopyala</button>
          <button class="secondary" id="copyWordBtn">Word için Kopyala</button>
          <button class="ghost" id="copyTextBtn">Metni Kopyala</button>
          <button class="ghost" id="downloadCsvBtn">CSV İndir</button>
          <button class="ghost" id="downloadXlsxBtn">Excel İndir</button>
          <button class="ghost" id="loadSampleBtn">Boş Şablon</button>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <div class="output-header">
        <h2>Çıktı</h2>
        <button class="copy-btn-top" id="copyTableBtnTop">Kopyala</button>
      </div>

      <div class="output-box table-wrap">
        <table id="resultTable">
          <colgroup>
            <col style="width:32%">
            <col style="width:12%">
            <col style="width:56%">
          </colgroup>
          <thead>
            <tr>
              <th>Personel (Toplam Nöbet)</th>
              <th>(Hafta sonu sayısı)</th>
              <th>Nöbet Günleri (virgülle, tek satır)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
<div class="subtle-title">Metin Önizleme</div>
<button id="copyPreviewTableBtn" class="copy-btn-top">Tablo Olarak Kopyala</button>
</div>
      <div id="textOutput" class="mono small"></div>
      <div id="wordCopyArea" class="sr-only-area"></div>
      <table id="plainCopyTable" class="sr-only-area"></table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const sampleData = '';


    const themeToggle = document.getElementById('themeToggle');
    const THEME_KEY = 'nobet-ozeti-theme';

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.body.classList.toggle('dark-theme', isDark);
      if (themeToggle) {
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? 'Koyu tema açık, açık temaya geç' : 'Açık tema açık, koyu temaya geç');
        themeToggle.setAttribute('title', isDark ? 'Koyu tema açık' : 'Açık tema açık');
      }
    }

    function getPreferredTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === 'dark' || savedTheme === 'light') return savedTheme;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    applyTheme(getPreferredTheme());

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const nextTheme = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
        applyTheme(nextTheme);
        localStorage.setItem(THEME_KEY, nextTheme);
      });
    }

    const input = document.getElementById('input');
    const excelFile = document.getElementById('excelFile');
    const statusBox = document.getElementById('status');
    const tbody = document.querySelector('#resultTable tbody');
    const textOutput = document.getElementById('textOutput');

    function setStatus(type, message) {
      statusBox.className = 'status ' + type;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = 'status';
      statusBox.textContent = '';
    }

    function titleCaseTr(value) {
      const lower = value
        .toLocaleLowerCase('tr-TR')
        .replace(/\s+/g, ' ')
        .trim();

      return lower.split(' ').map(word => {
        if (!word) return '';
        if (word.includes('.')) {
          return word.split('.').map(part => {
            if (!part) return '';
            return part.charAt(0).toLocaleUpperCase('tr-TR') + part.slice(1);
          }).join('.') + (word.endsWith('.') ? '' : '');
        }
        return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1);
      }).join(' ');
    }

    function normalizeName(raw) {
      return titleCaseTr(String(raw || '').replace(/\s+/g, ' ').trim());
    }

    function parseDayNumber(dateText) {
      const value = String(dateText || '').trim();
      const match = value.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
      if (!match) return null;
      const day = Number(match[1]);
      if (!Number.isInteger(day) || day < 1 || day > 31) return null;
      return day;
    }

    function isWeekend(dayName) {
      const val = String(dayName || '').trim().toLocaleLowerCase('tr-TR');
      return val === 'cumartesi' || val === 'pazar';
    }

    function parseTSV(text) {
      const rawLines = String(text || '')
        .replace(/\r/g, '')
        .split('\n')
        .map(line => line.trimEnd())
        .filter(line => line.trim() !== '');

      if (rawLines.length < 2) {
        throw new Error('En az başlık satırı ve bir veri satırı olmalı.');
      }

      const rows = rawLines.map(line => line.split('\t'));
      const headers = rows[0].map(h => String(h || '').trim());
      const normalizedHeaders = headers.map(h => h.toLocaleLowerCase('tr-TR'));

      if (normalizedHeaders[0] !== 'tarih' || normalizedHeaders[1] !== 'gün') {
        throw new Error('İlk iki sütun sırasıyla "Tarih" ve "Gün" olmalı.');
      }

      const dutyStartIndex = 2;
      if (headers.length < 4) {
        throw new Error('En az şu sütunlar olmalı: Tarih, Gün ve en az iki görev sütunu.');
      }

      const warnings = [];
      const personMap = new Map();

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.length < 2) {
          warnings.push(`${i + 1}. satır atlandı: Tarih/Gün bilgisi eksik.`);
          continue;
        }

        const dayNumber = parseDayNumber(row[0]);
        if (dayNumber === null) {
          throw new Error(`${i + 1}. satırdaki tarih okunamadı: "${row[0]}"`);
        }

        const weekend = isWeekend(row[1]);
        const seenSameDay = new Set();

        for (let c = dutyStartIndex; c < row.length; c++) {
          const rawName = row[c];
          if (rawName == null || String(rawName).trim() === '') continue;

          const name = normalizeName(rawName);
          const dedupeKey = `${name}__${dayNumber}`;

          if (seenSameDay.has(dedupeKey)) {
            warnings.push(`${i + 1}. satırda aynı kişi aynı günde tekrar ediyor: ${name} (${dayNumber}) — tek nöbet sayıldı.`);
            continue;
          }
          seenSameDay.add(dedupeKey);

          if (!personMap.has(name)) {
            personMap.set(name, { name, total: 0, weekend: 0, days: [] });
          }
          const rec = personMap.get(name);
          rec.total += 1;
          if (weekend) rec.weekend += 1;
          rec.days.push(dayNumber);
        }
      }

      const results = Array.from(personMap.values())
        .map(rec => ({
          ...rec,
          days: rec.days.sort((a, b) => a - b)
        }))
        .sort((a, b) => a.name.localeCompare(b.name, 'tr-TR'));

      return { results, warnings };
    }

    function renderResults(results, warnings) {
      tbody.innerHTML = '';
      textOutput.textContent = '';

      const lines = [];

      for (const person of results) {
        const tr = document.createElement('tr');
        const col1 = document.createElement('td');
        const col2 = document.createElement('td');
        const col3 = document.createElement('td');

        col1.textContent = `${person.name} (${person.total} nöbet)`;
        col2.textContent = String(person.weekend);
        col3.textContent = person.days.join(', ');

        tr.appendChild(col1);
        tr.appendChild(col2);
        tr.appendChild(col3);
        tbody.appendChild(tr);

        lines.push(`${person.name} (${person.total} nöbet) | (${person.weekend}) | ${person.days.join(', ')}`);
      }

      textOutput.textContent = lines.join('\n');

      if (warnings.length) {
        setStatus('warn', 'Özet oluşturuldu. Kontrol uyarıları:\n- ' + warnings.join('\n- '));
      } else {
        setStatus('ok', `Özet başarıyla oluşturuldu. Toplam ${results.length} personel listelendi.`);
      }
    }

    function generate() {
      clearStatus();
      try {
        const raw = input.value.trim();
        if (!raw) {
          throw new Error('İçerik bulunamadı. CSV dosyası yükleyin veya tabloyu metin alanına yapıştırın.');
        }
        const { results, warnings } = parseTSV(raw);
        if (!results.length) {
          throw new Error('Hiç personel bulunamadı. Yapıştırılan tabloyu kontrol edin.');
        }
        renderResults(results, warnings);
      } catch (err) {
        tbody.innerHTML = '';
        textOutput.textContent = '';
        setStatus('error', err.message || 'Bilinmeyen bir hata oluştu.');
      }
    }

    function copyTextOutput() {
      const text = textOutput.textContent.trim();
      if (!text) {
        setStatus('error', 'Kopyalanacak çıktı yok. Önce özet oluşturun.');
        return;
      }
      navigator.clipboard.writeText(text)
        .then(() => setStatus('ok', 'Metin çıktı panoya kopyalandı.'))
        .catch(() => setStatus('error', 'Panoya kopyalama başarısız oldu.'));
    }

    function downloadCsv() {
      const rows = [['Personel (Toplam Nöbet)', '(Hafta sonu sayısı)', 'Nöbet Günleri (virgülle, tek satır)']];
      const bodyRows = Array.from(tbody.querySelectorAll('tr'));
      if (!bodyRows.length) {
        setStatus('error', 'İndirilecek çıktı yok. Önce özet oluşturun.');
        return;
      }
      bodyRows.forEach(tr => {
        const cols = Array.from(tr.children).map(td => td.textContent);
        rows.push(cols);
      });

      const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nobet_ozeti.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus('ok', 'CSV dosyası indirildi.');
    }

    function normalizeDelimitedText(text) {
      const cleaned = String(text || '').replace(/\r/g, '');
      const lines = cleaned.split('\n').filter(line => line.trim() !== '');
      if (!lines.length) return '';

      const headerLine = lines[0];
      const delimiter = headerLine.includes('\t') ? '\t' : (headerLine.includes(';') ? ';' : ',');
      return lines.map(line => line.split(delimiter).join('\t')).join('\n');
    }

    async function loadExcelFile(file) {
      const name = (file && file.name ? file.name.toLowerCase() : '');
      const ext = name.split('.').pop();

      if (ext === 'csv') {
        const text = await file.text();
        input.value = normalizeDelimitedText(text);
        setStatus('ok', 'CSV dosyası yüklendi. Şimdi "Özet Oluştur" düğmesine basın.');
        return;
      }

      throw new Error('.xlsx ve .xls desteği bu sürümde tarayıcı uyumluluğu nedeniyle kapatıldı. Lütfen Excel dosyasını "CSV UTF-8" olarak kaydedip yeniden yükleyin. Bu yöntem daha güvenlidir.');
    }

    excelFile.addEventListener('change', async (event) => {
      clearStatus();
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        await loadExcelFile(file);
      } catch (err) {
        input.value = '';
        setStatus('error', err.message || 'Dosya okunamadı.');
      }
    });

    
    
    async function copyTableOutput() {
      const rows = Array.from(document.querySelectorAll('#resultTable tr'));
      if (!rows.length) {
        setStatus('error', 'Kopyalanacak tablo yok. Önce özet oluşturun.');
        return;
      }

      const text = rows.map(row =>
        Array.from(row.children)
          .map(cell => cell.innerText.trim())
          .join('\t')
      ).join('\n');

      try {
        await navigator.clipboard.writeText(text);
        setStatus('ok', 'Tablo panoya kopyalandı. Excel veya Word’e yapıştırabilirsiniz.');
      } catch (err) {
        setStatus('error', 'Tablo kopyalanamadı.');
      }
    }

    function buildTableRowsFromOutput() {
      const bodyRows = Array.from(tbody.querySelectorAll('tr'));
      return bodyRows.map(tr => Array.from(tr.children).map(td => td.textContent || ''));
    }

    function downloadXlsxOutput() {
      const bodyRows = buildTableRowsFromOutput();
      if (!bodyRows.length) {
        setStatus('error', 'İndirilecek çıktı yok. Önce özet oluşturun.');
        return;
      }

      if (typeof XLSX === 'undefined') {
        setStatus('error', 'Excel indirme bileşeni yüklenemedi.');
        return;
      }

      const rows = [
        ['Personel (Toplam Nöbet)', '(Hafta sonu sayısı)', 'Nöbet Günleri (virgülle, tek satır)'],
        ...bodyRows
      ];

      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      worksheet['!cols'] = [{ wch: 30 }, { wch: 18 }, { wch: 55 }];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Nobet Ozeti');
      XLSX.writeFile(workbook, 'nobet_ozeti.xlsx');
      setStatus('ok', 'Excel dosyası indirildi.');
    }

async function copyWordOutput() {
      const bodyRows = Array.from(tbody.querySelectorAll('tr'));
      if (!bodyRows.length) {
        setStatus('error', 'Kopyalanacak çıktı yok. Önce özet oluşturun.');
        return;
      }

      const wordCopyArea = document.getElementById('wordCopyArea');
      const htmlTable = `
        <table border="1" style="border-collapse:collapse; font-family:Calibri, Arial, sans-serif; font-size:11pt;">
          <thead>
            <tr>
              <th style="padding:6px 8px;">Personel (Toplam Nöbet)</th>
              <th style="padding:6px 8px;">(Hafta sonu sayısı)</th>
              <th style="padding:6px 8px;">Nöbet Günleri (virgülle, tek satır)</th>
            </tr>
          </thead>
          <tbody>
            ${bodyRows.map(tr => {
              const cols = Array.from(tr.children).map(td => td.textContent);
              return `<tr>
                <td style="padding:6px 8px;">${cols[0] || ''}</td>
                <td style="padding:6px 8px;">${cols[1] || ''}</td>
                <td style="padding:6px 8px;">${cols[2] || ''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;

      wordCopyArea.innerHTML = htmlTable;

      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const blobHtml = new Blob([htmlTable], { type: 'text/html' });
          const plainText = bodyRows.map(tr => Array.from(tr.children).map(td => td.textContent).join(' | ')).join('\n');
          const blobText = new Blob([plainText], { type: 'text/plain' });
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': blobHtml,
              'text/plain': blobText
            })
          ]);
          setStatus('ok', 'Çıktı Word uyumlu tablo olarak kopyalandı.');
          return;
        }

        const range = document.createRange();
        range.selectNodeContents(wordCopyArea);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        const ok = document.execCommand('copy');
        selection.removeAllRanges();

        if (ok) {
          setStatus('ok', 'Çıktı Word uyumlu tablo olarak kopyalandı.');
        } else {
          setStatus('error', 'Word için kopyalama başarısız oldu.');
        }
      } catch (err) {
        setStatus('error', 'Word için kopyalama başarısız oldu.');
      }
    }

document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('loadSampleBtn').addEventListener('click', () => {
      input.value = `Tarih\tGün\tMESAİ\tA\tB\tC\n`;
      clearStatus();
      setStatus('ok', 'Boş şablon yerleştirildi. Kendi verinizi yapıştırabilir veya CSV yükleyebilirsiniz.');
    });
    document.getElementById('copyTableBtn').addEventListener('click', copyTableOutput);
    const topBtn = document.getElementById('copyTableBtnTop');
    if(topBtn){ topBtn.addEventListener('click', copyTableOutput);}
    const previewBtn = document.getElementById('copyPreviewTableBtn');
    if(previewBtn){ previewBtn.addEventListener('click', copyTableOutput);}
    document.getElementById('copyWordBtn').addEventListener('click', copyWordOutput);
    document.getElementById('copyTextBtn').addEventListener('click', copyTextOutput);
    document.getElementById('downloadXlsxBtn').addEventListener('click', downloadXlsxOutput);
    document.getElementById('downloadCsvBtn').addEventListener('click', downloadCsv);
  </script>
</body>
