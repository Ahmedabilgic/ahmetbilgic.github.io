<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ahmet Bilgiç - Sayfalar</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding:40px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
max-width:800px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-decoration:none;
color:black;
}
</style>

</head>

<body>

<h1>Site Sayfaları</h1>

<div class="container" id="pages"></div>

<script>

const repo = "ahmetbilgic.github.io";
const user = "ahmedabilgic";

fetch(`https://api.github.com/repos/${user}/${repo}/contents`)
.then(res => res.json())
.then(files => {

const container = document.getElementById("pages");

files.forEach(file => {

if(file.name.endsWith(".html") && file.name !== "index.html"){

const link = document.createElement("a");

link.href = file.name;
link.className = "card";
link.innerText = file.name.replace(".html","");

container.appendChild(link);

}

});

});

</script>

</body>
</html>
